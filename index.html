<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MY A.I. — Sabathil720</title>
  <meta name="description" content="MY A.I. — official brand hub for Sabathil720. Watch the video, comics, episodes, and merch coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="page">
    <header class="brand">
      <p class="tag">Sabathil720</p>
      <h1 class="title">MY A.I.</h1>
    </header>

    <figure class="hero">
      <img
        id="hero-img"
        src="hero.jpg"
        alt="Sierra and 720 in neon cyberpunk city — MY A.I."
        width="1080"
        height="1920"
      />
    </figure>

    <nav class="links" aria-label="MY A.I. sections">
      <a
        class="link video"
        href="https://www.youtube.com/watch?v=epvNC628kIs"
        target="_blank"
        rel="noopener noreferrer"
      >
        VIDEO
      </a>

      <a class="link soon" href="#comics" id="comics">
        <span class="label">COMICS</span>
        <span class="soon-tag">Coming Soon</span>
      </a>

      <a class="link soon" href="#episodes" id="episodes">
        <span class="label">EPISODES</span>
        <span class="soon-tag">Coming Soon</span>
      </a>

      <a class="link soon" href="#merchandise" id="merchandise">
        <span class="label">MERCHANDISE</span>
        <span class="soon-tag">Coming Soon</span>
      </a>
    </nav>

    <footer class="foot">
      <p>© <span id="y"></span> Sabathil720 · MY A.I.</p>
    </footer>
  </main>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    (async function loadHero() {
      var img = document.getElementById("hero-img");
      try {
        var res = await fetch("hero.jpg", { method: "HEAD" });
        if (res.ok) return;
      } catch (e) {}
      try {
        var parts = ["hero/p00.b64","hero/p01.b64","hero/p02.b64","hero/p03.b64","hero/p04.b64","hero/p05.b64","hero/p06.b64","hero/p07.b64","hero/p08.b64","hero/p09.b64","hero/p10.b64","hero/p11.b64","hero/p12.b64","hero/p13.b64","hero/p14.b64","hero/p15.b64","hero/p16.b64"];
        var s = "";
        for (var i = 0; i < parts.length; i++) {
          s += await (await fetch(parts[i])).text();
        }
        s = s.replace(/\s+/g, "");
        var bin = Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
        img.src = URL.createObjectURL(new Blob([bin], { type: "image/jpeg" }));
      } catch (e) {
        console.error("hero load failed", e);
      }
    })();
  </script>
</body>
</html>
